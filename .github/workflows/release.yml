name: Release

# A `v*` tag publishes the Windows installer to that tag's GitHub release. `workflow_dispatch`
# builds the same installer without publishing, so the packaging can be checked before a tag exists.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # `beforeBuildCommand` is a bare `npm run build` that Tauri runs in the frontend directory,
      # so the UI's dependencies have to be installed there first.
      - name: Install UI dependencies
        run: npm ci
        working-directory: apps/desktop/ui
      - name: Install the Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked
      # NSIS only: it yields the single setup `.exe` this release exists to ship, and builds
      # without the WiX toolchain the `.msi` target would pull in.
      - name: Build the installer
        run: cargo tauri build --bundles nsis
        working-directory: apps/desktop
      - name: Collect the installer
        shell: bash
        run: |
          mkdir dist-release
          cp target/release/bundle/nsis/*.exe dist-release/ 2>/dev/null || cp ../../target/release/bundle/nsis/*.exe dist-release/
        working-directory: apps/desktop
      - uses: actions/upload-artifact@v4
        with:
          name: cuthulhu-windows
          path: apps/desktop/dist-release/*.exe
      - name: Publish to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: apps/desktop/dist-release/*.exe
          generate_release_notes: true
          body: |
            Windows installer (unsigned, so SmartScreen will warn: *More info → Run anyway*).

            A Silhouette cutter needs the WinUSB driver bound to it (for example with Zadig) before
            cuthulhu can see it. A serial GCC Puma needs no driver.
