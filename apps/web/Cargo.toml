[package]
name = "web"
version = "0.1.4"
edition = "2021"
license = "GPL-3.0-or-later"

[[bin]]
name = "cuthulhu-web"
path = "src/main.rs"

[dependencies]
# The desktop's logic without its Tauri shell: the same document state, device manager, presets
# and usage log, so a cut from a browser takes the planning path a cut from the desktop takes.
desktop = { path = "../desktop", default-features = false }
document = { path = "../../crates/document" }
geometry = { path = "../../crates/geometry" }
cutplan = { path = "../../crates/cutplan" }
driver-core = { path = "../../crates/driver-core" }
driver-registry = { path = "../../crates/driver-registry" }
trace = { path = "../../crates/trace" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
# A small blocking server: one thread per request suits a Pi serving a handful of browsers, and a
# blocking call (a cut waiting on the worker) then holds only its own request.
tiny_http = "0.12"

[dev-dependencies]
tempfile = "3"
